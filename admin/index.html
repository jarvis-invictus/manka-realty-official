<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invictus CMS</title>
    <link rel="icon" type="image/png" href="/assets/images/invictus_logo.png" />
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />

    <style>
      /* ── DESIGN TOKEN SYSTEM ──────────────────────────────── */
      :root {
        /* Colors */
        --color-primary: #1e3a8a;        /* Core Navy */
        --color-accent: #2563eb;         /* Interactive Navy */
        --color-bg: #f8fafc;             /* Page Background */
        --color-surface: #ffffff;        /* Cards & Panels */
        --color-text-dark: #0f172a;      /* Headings & Body */
        --color-text-secondary: #64748b; /* Labels & Muted */
        --color-border: #e2e8f0;         /* Lines & Outlines */
        
        --color-success: #16a34a;        /* Publish / Active */
        --color-danger: #dc2626;         /* Delete / Error */
        
        /* Typography */
        --font-heading: 'Georgia', serif;
        --font-body: system-ui, -apple-system, sans-serif;
        
        --text-xs: 11px;
        --text-sm: 13px;
        --text-base: 14px;
        
        /* Spacing */
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;
        
        /* Shape */
        --radius-sm: 6px;                /* Buttons, Inputs */
        --radius-card: 12px;             /* Panels, Modals */
        --shadow-elevated: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      body { 
        background-color: var(--color-bg); 
        margin: 0; 
        font-family: var(--font-body);
      }

      /* ── 1. TOP NAVIGATION BAR ─────────────────────────────── */
      [class*="AppHeader"] {
        background-color: var(--color-surface) !important;
        border-top: none !important;
        border-bottom: 1px solid var(--color-border) !important;
        box-shadow: none !important;
      }
      [class*="AppHeader"] h1,
      [class*="AppHeader"] a {
        color: var(--color-primary) !important;
        font-family: var(--font-heading);
      }
      
      /* Fix "Contents" tab white-box overlap */
      [class*="AppHeader"] a[class*="tab"],
      [class*="AppHeader"] a[role="tab"] {
        background: transparent !important;
        border: none !important;
        border-bottom: 2px solid transparent !important;
        box-shadow: none !important;
      }
      [class*="AppHeader"] a[class*="active"] {
        border-bottom: 2px solid var(--color-primary) !important;
      }
      
      /* User avatar */
      [class*="AvatarImage"],
      [class*="Avatar"] {
        background-color: var(--color-primary) !important;
        color: var(--color-surface) !important;
        font-weight: 600 !important;
      }

      /* ── 2. SIDEBAR ────────────────────────────────────────── */
      [class*="SidebarContainer"] {
        background-color: var(--color-surface) !important;
        border-right: 1px solid var(--color-border) !important;
        padding: var(--space-md) !important;
      }
      [class*="SidebarHeading"] {
        color: var(--color-text-secondary) !important;
        font-family: var(--font-heading);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: var(--text-sm) !important;
        margin-bottom: var(--space-sm) !important;
      }
      [class*="SidebarNavLink"] {
        border-radius: var(--radius-sm) !important;
        padding: var(--space-sm) var(--space-md) !important;
        color: var(--color-text-dark) !important;
        font-size: var(--text-base) !important;
        transition: background 0.15s;
      }
      [class*="SidebarNavLink"]:hover {
        background-color: var(--color-bg) !important;
      }
      [class*="SidebarNavLink"][class*="active"] {
        background-color: #eff6ff !important;
        color: var(--color-primary) !important;
        font-weight: 600 !important;
      }

      /* ── 3. LIST / GRID CARDS ──────────────────────────────── */
      [class*="Card"] {
        background-color: var(--color-surface) !important;
        border: 1px solid var(--color-border) !important;
        border-radius: var(--radius-card) !important;
        box-shadow: var(--shadow-elevated) !important;
        padding: var(--space-md) !important;
        margin-bottom: var(--space-md) !important;
      }
      [class*="Card"] h2, [class*="Card"] h3 {
        font-family: var(--font-heading) !important;
        color: var(--color-text-dark) !important;
      }

      /* ── 4. BUTTONS ────────────────────────────────────────── */
      button, [class*="Button"] {
        border-radius: var(--radius-sm) !important;
        padding: var(--space-sm) var(--space-md) !important;
        font-weight: 600 !important;
        font-family: var(--font-body) !important;
      }

      /* ── 5. FORM FIELDS & LABELS ───────────────────────────── */
      /* By excluding input[role="combobox"], we leave the hidden 
         react-select input alone, preserving functionality/look. */
      [class*="ControlPaneContainer"] input:not([role="combobox"]):not([type="checkbox"]):not([type="radio"]),
      [class*="ControlPaneContainer"] textarea {
        border-radius: var(--radius-sm) !important;
        border: 1px solid var(--color-border) !important;
        padding: 10px 12px !important;
        box-shadow: none !important;
        font-size: var(--text-base) !important;
        font-family: var(--font-body) !important;
        transition: border-color 0.15s;
        background-color: var(--color-surface) !important;
      }
      [class*="ControlPaneContainer"] input:not([role="combobox"]):focus,
      [class*="ControlPaneContainer"] textarea:focus {
        border-color: var(--color-accent) !important;
        outline: 2px solid rgba(37,99,235,0.25) !important;
        outline-offset: 0 !important;
      }

      /* Labels */
      [class*="ControlPaneContainer"] [class*="FieldLabel"],
      [class*="ControlPaneContainer"] label {
        font-weight: 600 !important;
        color: var(--color-text-secondary) !important;
        font-family: var(--font-body) !important;
        text-transform: uppercase;
        font-size: var(--text-xs) !important;
        letter-spacing: 0.7px;
        margin-bottom: var(--space-xs) !important;
      }

      /* Collapsible Section Headers */
      [class*="ObjectWidgetTopBar"] {
        background-color: var(--color-primary) !important;
        border-radius: var(--radius-sm) var(--radius-sm) 0 0 !important;
        padding: 10px var(--space-md) !important;
      }
      [class*="ObjectWidgetTopBar"] * {
        color: var(--color-surface) !important;
        font-family: var(--font-heading) !important;
        font-weight: 600 !important;
        font-size: var(--text-sm) !important;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* ── 6. PREVIEW PANE CONTAINER ─────────────────────────── */
      [class*="PreviewPaneContainer"] {
        background-color: var(--color-bg) !important;
        border-left: 1px solid var(--color-border) !important;
        padding: var(--space-lg) !important;
      }

      /* PreviewPane inner elements */
      [class*="PreviewPaneFrame"] img,
      iframe[class*="preview"] img,
      .property-image-wrapper img {
        max-width: 100% !important;
        width: 100% !important;
        height: 220px !important;
        object-fit: cover !important;
      }
      .property-card {
        max-width: 380px !important;
        width: 100% !important;
        overflow: hidden !important;
      }
      .properties-carousel-track {
        max-width: 400px !important;
        overflow: hidden !important;
      }

      /* ── MEDIA LIBRARY MODAL (VERIFIED ROLE) ───────────────── */
      [role="dialog"] {
        border-radius: var(--radius-card) !important;
        overflow: hidden !important;
        box-shadow: var(--shadow-elevated) !important;
      }
      [role="dialog"] header,
      [role="dialog"] > div:first-child {
        background-color: var(--color-primary) !important;
        color: var(--color-surface) !important;
        padding: var(--space-md) var(--space-lg) !important;
        font-family: var(--font-heading) !important;
        font-weight: 600 !important;
      }
      [role="dialog"] header *,
      [role="dialog"] > div:first-child * {
        color: var(--color-surface) !important;
      }

      /* ── USER MENU (VERIFIED ROLE) ─────────────────────────── */
      [role="menu"] {
        border-radius: var(--radius-sm) !important;
        border: 1px solid var(--color-border) !important;
        box-shadow: var(--shadow-elevated) !important;
        overflow: hidden !important;
        background: var(--color-surface) !important;
      }
      [role="menuitem"] {
        padding: 10px var(--space-md) !important;
        font-size: var(--text-base) !important;
        color: var(--color-text-dark) !important;
        font-family: var(--font-body) !important;
      }
      [role="menuitem"]:hover {
        background-color: var(--color-bg) !important;
        color: var(--color-primary) !important;
      }

      /* ── DECAP WATERMARK & BRANDING ────────────────────────── */
      /* Login screen bottom logo (verified class via live DOM) */
      [class*="NetlifyCreditIcon"],
      /* Fallback for other locations */
      a[href*="decapcms.org"],
      a[href*="netlifycms.org"] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
      
      /* Ensure Invictus logo scales nicely on login page */
      [class*="AuthenticationPage"] img {
        max-width: 250px !important;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // ── Load real site styles into preview pane ──────────────
      CMS.registerPreviewStyle('/assets/css/styles.css');
      CMS.registerPreviewStyle('/assets/css/responsive.css');

      // ── MutationObserver: reliably hide Decap branding ───────
      // Catches elements rendered after JS hydration without relying on hashed classes.
      var brandingObserver = new MutationObserver(function(mutations) {
        var selectors = [
          'a[href*="decapcms.org"]',
          'a[href*="netlifycms.org"]',
          '[class*="NetlifyCreditIcon"]'
        ];
        selectors.forEach(function(sel) {
          document.querySelectorAll(sel).forEach(function(el) {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
          });
        });
      });
      brandingObserver.observe(document.body, { childList: true, subtree: true });

      // ── Preview template ─────────────────────────────────────
      var PropertyPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var data = entry.get('data').toJS();

          var basic_info        = data.basic_info        || {};
          var pricing           = data.pricing           || {};
          var media_description = data.media_description || {};

          var title        = basic_info.title         || '';
          var status       = basic_info.status        || 'Available';
          var propertyType = basic_info.property_type || 'Residential';
          var listingType  = basic_info.listing_type  || 'Buy';
          var price        = pricing.price             != null ? pricing.price : null;
          var priceUnit    = pricing.price_unit        || 'Lakh';
          var description  = media_description.description || '';
          var photos       = media_description.photos  || [];

          // Empty state
          if (!title && price === null && photos.length === 0) {
            return h('div', {
              style: {
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center',
                height: '100%', minHeight: '400px',
                color: '#94a3b8', fontFamily: 'Georgia, serif',
                textAlign: 'center', padding: '40px'
              }
            },
              h('div', { style: { fontSize: '48px', marginBottom: '16px' } }, '🏠'),
              h('p', { style: { fontSize: '18px', fontWeight: '600', margin: '0 0 8px' } }, 'No content yet'),
              h('p', { style: { fontSize: '14px', margin: 0 } }, 'Fill in the fields on the left to see a live preview of the property card.')
            );
          }

          var priceStr = price !== null
            ? '₹' + price + ' ' + (priceUnit === 'Lakh' ? 'L' : 'Cr') + ((listingType === 'Rent' || listingType === 'Lease') ? '/mo' : '')
            : '';

          var imgUrl = null;
          if (photos.length > 0) {
            var asset = getAsset(photos[0]);
            if (asset) imgUrl = asset.toString();
          }

          var category = propertyType.toLowerCase();

          var cardStyle = {
            maxWidth: '360px',
            width: '100%',
            borderRadius: '12px',
            overflow: 'hidden',
            boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
            fontFamily: 'Georgia, serif',
            background: '#fff'
          };
          var imgStyle = {
            width: '100%',
            height: '200px',
            objectFit: 'cover',
            display: imgUrl ? 'block' : 'none'
          };

          return h('div', {
            style: {
              padding: '32px', background: '#f8fafc',
              minHeight: '100vh', display: 'flex',
              flexDirection: 'column', alignItems: 'center',
              justifyContent: 'flex-start', paddingTop: '48px'
            }
          },
            h('p', {
              style: {
                fontFamily: 'system-ui, -apple-system, sans-serif', fontSize: '11px',
                textTransform: 'uppercase', letterSpacing: '1px',
                color: '#64748b', marginBottom: '16px'
              }
            }, 'Live Card Preview'),
            h('div', { style: cardStyle },
              imgUrl && h('div', { style: { position: 'relative' } },
                h('img', { src: imgUrl, alt: title, style: imgStyle }),
                priceStr && h('span', {
                  style: {
                    position: 'absolute', bottom: '10px', left: '10px',
                    background: 'rgba(30,58,138,0.9)', color: '#fff',
                    padding: '4px 10px', borderRadius: '4px',
                    fontSize: '13px', fontWeight: '700', letterSpacing: '0.3px'
                  }
                }, priceStr)
              ),
              h('div', { style: { padding: '16px' } },
                h('div', {
                  style: {
                    display: 'flex', justifyContent: 'space-between',
                    alignItems: 'center', marginBottom: '8px'
                  }
                },
                  h('h3', { style: { margin: 0, fontSize: '15px', fontWeight: '700', color: '#0f172a' } }, title || 'Property Title'),
                  h('span', {
                    style: {
                      fontSize: '11px', background: '#dcfce7',
                      color: '#166534', padding: '2px 8px',
                      borderRadius: '999px', fontWeight: '600'
                    }
                  }, status)
                ),
                description && h('p', {
                  style: {
                    fontSize: '12px', color: '#475569',
                    margin: '0 0 12px', lineHeight: '1.5',
                    overflow: 'hidden', maxHeight: '48px'
                  }
                }, description),
                h('a', {
                  href: '#',
                  style: {
                    display: 'block', textAlign: 'center',
                    background: '#1e3a8a', color: '#fff',
                    padding: '10px', borderRadius: '6px',
                    fontSize: '12px', fontWeight: '700',
                    letterSpacing: '0.5px', textDecoration: 'none'
                  }
                }, 'INQUIRE VIA WHATSAPP →')
              )
            )
          );
        }
      });

      CMS.registerPreviewTemplate('properties', PropertyPreview);
    </script>
  </body>
</html>
