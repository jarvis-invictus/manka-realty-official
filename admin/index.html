<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invictus CMS</title>
    <link rel="icon" type="image/png" href="/assets/images/invictus_logo.png" />
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />

    <style>
      /* ── BRAND TOKENS ─────────────────────────────────────── */
      :root {
        --brand-primary: #1e3a8a;
        --brand-accent:  #2563eb;
        --brand-bg:      #f8fafc;
        --brand-border:  #e2e8f0;
        --brand-text:    #1e293b;
        --brand-muted:   #64748b;
      }
      body { background: var(--brand-bg); margin: 0; }

      /* ── FIX REGRESSION: Nav tabs collapsed to 0×0 ─────────
         The prior batch inadvertently over-scoped a flex/height rule
         that collapsed the top nav tabs. Reset everything that could
         affect nav tab sizing. */
      nav, nav > *, nav a, nav ul, nav li,
      [role="navigation"], [role="navigation"] > *,
      [role="tablist"], [role="tab"] {
        height: auto !important;
        min-height: unset !important;
        max-height: unset !important;
        width: auto !important;
        min-width: unset !important;
        overflow: visible !important;
        display: revert !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      /* ── FIX #2: Stray blue bar ─────────────────────────────
         Decap renders a thin colored stripe via a ::before pseudo or
         a top-level <div> that carries a background-color. We target
         it structurally by excluding the actual app shell divs. */
      body > div > div:first-child:not([class]) {
        display: none !important;
      }
      /* Also catch if it's a pseudo-element on the app root */
      #nc-root > div::before,
      body > div::before {
        display: none !important;
        height: 0 !important;
      }

      /* ── FIX #1: Select field glitch ────────────────────────
         We previously targeted [class*="ControlPaneContainer"] select
         but Decap's select widgets are NOT native <select> elements —
         they're custom React components built with styled-divs.
         The floating rounded box is the focus ring on the *wrapper* div.
         
         Strategy: remove our custom border/outline from ALL divs and
         spans inside the editor pane so we don't accidentally double-
         border Decap's internal components. Only style actual <input>,
         <textarea>, and native <select> elements. */
      
      /* Remove the box-shadow and outline from ALL non-input elements
         inside editor — this kills the floating ring artifact */
      [data-testid] div:focus,
      [data-testid] div:focus-within,
      [data-testid] span:focus {
        outline: none !important;
        box-shadow: none !important;
      }

      /* Only apply our styling to actual native form elements */
      input:not([type="checkbox"]):not([type="radio"]):not([type="file"]) {
        border-radius: 6px !important;
        border: 1px solid var(--brand-border) !important;
        padding: 8px 12px !important;
        box-shadow: none !important;
        font-size: 14px !important;
      }
      input:not([type="checkbox"]):not([type="radio"]):focus {
        border-color: var(--brand-accent) !important;
        outline: 2px solid rgba(37,99,235,0.2) !important;
        outline-offset: 1px !important;
        box-shadow: none !important;
      }
      textarea {
        border-radius: 6px !important;
        border: 1px solid var(--brand-border) !important;
        padding: 8px 12px !important;
        box-shadow: none !important;
        font-size: 14px !important;
      }
      textarea:focus {
        border-color: var(--brand-accent) !important;
        outline: 2px solid rgba(37,99,235,0.2) !important;
        outline-offset: 1px !important;
        box-shadow: none !important;
      }
      /* Native select only */
      select {
        border-radius: 6px !important;
        border: 1px solid var(--brand-border) !important;
        padding: 8px 12px !important;
        box-shadow: none !important;
        font-size: 14px !important;
        background: #fff !important;
      }
      select:focus {
        border-color: var(--brand-accent) !important;
        outline: 2px solid rgba(37,99,235,0.2) !important;
        box-shadow: none !important;
      }

      /* ── FIX #1 PART 2: Nuke any box-shadow on styled-select wrappers
         Decap uses a custom div-based select. We can't target its hashed
         class, but we CAN target any div that has cursor:pointer and
         contains styled text — the floating ring comes from a focused div
         that we accidentally gave a border to. Reset all div focus rings. */
      div:focus {
        outline: none !important;
        box-shadow: none !important;
      }
      div:focus-within > div {
        /* Don't bubble our outlines into nested divs */
        box-shadow: inherit;
      }

      /* ── DECAP WATERMARK — Verified selector approach ────────
         Instead of guessing class names, we target the actual
         rendered anchor elements by their href and their container,
         and also run a MutationObserver in JS (below) to catch
         elements that render after initial paint. */
      a[href="https://decapcms.org"],
      a[href="https://www.decapcms.org"],
      a[href*="decapcms.org"],
      a[href*="netlifycms.org"] {
        display: none !important;
      }
      /* Hide the container of those links too */
      a[href*="decapcms.org"] + *,
      a[href*="decapcms.org"] ~ *,
      :has(> a[href*="decapcms.org"]) {
        display: none !important;
      }

      /* ── MEDIA LIBRARY ───────────────────────────────────────
         Decap renders its modal inside a portal div at the end of body.
         We use [role="dialog"] which is a stable ARIA attribute. */
      [role="dialog"] {
        border-radius: 12px !important;
        overflow: hidden !important;
      }
      [role="dialog"] header,
      [role="dialog"] > div:first-child {
        background: var(--brand-primary) !important;
        color: #fff !important;
        padding: 16px 20px !important;
      }
      [role="dialog"] header *,
      [role="dialog"] > div:first-child * {
        color: #fff !important;
      }
      [role="dialog"] button {
        border-radius: 6px !important;
        font-weight: 600 !important;
        font-size: 13px !important;
      }

      /* ── USER MENU / DROPDOWN ────────────────────────────────
         Decap's user menu is rendered as a [role="menu"] portal. */
      [role="menu"] {
        border-radius: 8px !important;
        border: 1px solid var(--brand-border) !important;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12) !important;
        overflow: hidden !important;
        background: #fff !important;
        min-width: 160px !important;
      }
      [role="menuitem"] {
        padding: 10px 18px !important;
        font-size: 14px !important;
        color: var(--brand-text) !important;
      }
      [role="menuitem"]:hover {
        background: #eff6ff !important;
        color: var(--brand-primary) !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // ── Load real site styles into preview pane ──────────────
      CMS.registerPreviewStyle('/assets/css/styles.css');
      CMS.registerPreviewStyle('/assets/css/responsive.css');

      // ── MutationObserver: reliably hide Decap branding ───────
      // CSS alone can't catch elements rendered after JS hydration.
      // This observer runs continuously and nukes any Decap links
      // the moment they appear in the DOM.
      var brandingObserver = new MutationObserver(function(mutations) {
        var selectors = [
          'a[href*="decapcms.org"]',
          'a[href*="netlifycms.org"]'
        ];
        selectors.forEach(function(sel) {
          document.querySelectorAll(sel).forEach(function(el) {
            // Hide the element and walk up to hide its parent container
            var target = el;
            // Walk up max 3 levels to find the branding block container
            for (var i = 0; i < 3; i++) {
              if (target.parentElement && target.parentElement !== document.body) {
                target = target.parentElement;
              }
            }
            target.style.setProperty('display', 'none', 'important');
            target.style.setProperty('visibility', 'hidden', 'important');
          });
        });
      });
      brandingObserver.observe(document.body, { childList: true, subtree: true });

      // ── Preview template ─────────────────────────────────────
      var PropertyPreview = createClass({
        render: function() {
          var entry    = this.props.entry;
          var getAsset = this.props.getAsset;
          var data     = entry.get('data').toJS();

          var basic_info        = data.basic_info        || {};
          var pricing           = data.pricing           || {};
          var media_description = data.media_description || {};

          var title        = basic_info.title         || '';
          var status       = basic_info.status        || 'Available';
          var propertyType = basic_info.property_type || 'Residential';
          var listingType  = basic_info.listing_type  || 'Buy';
          var price        = pricing.price             != null ? pricing.price : null;
          var priceUnit    = pricing.price_unit        || 'Lakh';
          var description  = media_description.description || '';
          var photos       = media_description.photos  || [];

          // Empty state
          if (!title && price === null && photos.length === 0) {
            return h('div', {
              style: {
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center',
                minHeight: '400px', color: '#94a3b8',
                fontFamily: 'Georgia, serif', textAlign: 'center', padding: '40px'
              }
            },
              h('div', { style: { fontSize: '48px', marginBottom: '16px' } }, '🏠'),
              h('p', { style: { fontSize: '18px', fontWeight: '600', margin: '0 0 8px' } }, 'No content yet'),
              h('p', { style: { fontSize: '14px', margin: 0 } }, 'Fill in the fields on the left to see a live card preview.')
            );
          }

          var priceStr = '';
          if (price !== null) {
            priceStr = '₹' + price + ' ' + (priceUnit === 'Lakh' ? 'L' : 'Cr');
            if (listingType === 'Rent' || listingType === 'Lease') priceStr += '/mo';
          }

          var imgUrl = null;
          if (photos.length > 0) {
            var asset = getAsset(photos[0]);
            if (asset) imgUrl = asset.toString();
          }

          return h('div', {
            style: {
              padding: '32px', background: '#f0f4f8',
              minHeight: '100vh', display: 'flex',
              flexDirection: 'column', alignItems: 'center', paddingTop: '48px'
            }
          },
            h('p', {
              style: {
                fontFamily: 'sans-serif', fontSize: '11px',
                textTransform: 'uppercase', letterSpacing: '1px',
                color: '#94a3b8', marginBottom: '16px'
              }
            }, 'Live Card Preview'),
            h('div', {
              style: {
                maxWidth: '360px', width: '100%',
                borderRadius: '10px', overflow: 'hidden',
                boxShadow: '0 4px 16px rgba(0,0,0,0.10)',
                fontFamily: 'Georgia, serif', background: '#fff'
              }
            },
              imgUrl && h('div', { style: { position: 'relative' } },
                h('img', {
                  src: imgUrl, alt: title,
                  style: {
                    width: '100%', height: '200px',
                    objectFit: 'cover', display: 'block'
                  }
                }),
                priceStr && h('span', {
                  style: {
                    position: 'absolute', bottom: '10px', left: '10px',
                    background: 'rgba(30,58,138,0.9)', color: '#fff',
                    padding: '4px 10px', borderRadius: '4px',
                    fontSize: '13px', fontWeight: '700'
                  }
                }, priceStr)
              ),
              h('div', { style: { padding: '16px' } },
                h('div', {
                  style: {
                    display: 'flex', justifyContent: 'space-between',
                    alignItems: 'center', marginBottom: '8px'
                  }
                },
                  h('h3', {
                    style: { margin: 0, fontSize: '15px', fontWeight: '700', color: '#1e293b' }
                  }, title || 'Property Title'),
                  h('span', {
                    style: {
                      fontSize: '11px', background: '#dcfce7',
                      color: '#166534', padding: '2px 8px',
                      borderRadius: '999px', fontWeight: '600'
                    }
                  }, status)
                ),
                description && h('p', {
                  style: {
                    fontSize: '12px', color: '#64748b',
                    margin: '0 0 12px', lineHeight: '1.5'
                  }
                }, description),
                h('a', {
                  href: '#',
                  style: {
                    display: 'block', textAlign: 'center',
                    background: '#1e3a8a', color: '#fff',
                    padding: '10px', borderRadius: '6px',
                    fontSize: '12px', fontWeight: '700',
                    letterSpacing: '0.5px', textDecoration: 'none'
                  }
                }, 'INQUIRE VIA WHATSAPP →')
              )
            )
          );
        }
      });

      CMS.registerPreviewTemplate('properties', PropertyPreview);
    </script>
  </body>
</html>
